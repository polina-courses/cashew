# Локальная версия: собирает APK на каждый пуш в main и выкладывает его в Releases.
# Подпись берётся из секретов репозитория (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
name: Build APK

on:
  push:
    # feature/** — только проверка сборки, без публикации в Releases
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"  # под эту версию собран pubspec.lock (intl 0.18.1)
          channel: stable
          cache: true

      - name: Подготовить ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — без него обновления не будут ставиться поверх старой версии"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore.jks"
          } > android/key.properties

      - run: flutter pub get

      - name: Тесты
        shell: bash
        run: |
          sudo apt-get install -y libsqlite3-dev >/dev/null
          set -o pipefail
          flutter test test/envelopes_test.dart 2>&1 | tee test.log

      - name: Показать ошибку тестов
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          msg=$(grep -v "^\s*$" test.log | tail -50 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Ошибка тестов::$msg"

      - name: Собрать APK
        # Номер сборки растёт с каждым запуском, чтобы Android принимал обновление
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --build-number=$((1000 + ${{ github.run_number }})) 2>&1 | tee build.log

      - name: Показать ошибку сборки
        # Выводит хвост лога в аннотацию — её видно на странице запуска и через API
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -n -i -E "error|exception|failed|what went wrong" build.log | tail -40 > err.txt || true
          echo "--- tail ---" >> err.txt
          tail -40 build.log >> err.txt
          msg=$(sed -e 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Ошибка сборки::$msg"

      - name: Переименовать
        if: github.ref == 'refs/heads/main'
        run: cp build/app/outputs/flutter-apk/app-release.apk ../cashew-local-${{ github.run_number }}.apk

      - name: Выложить в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Сборка ${{ github.run_number }}"
          body: ${{ github.event.head_commit.message }}
          files: cashew-local-${{ github.run_number }}.apk
          make_latest: true
